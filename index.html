<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2人予定表・月表示</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e5e7eb;
      --card: #ffffff;
      --soft: #f8fafc;
      --pink: #f472b6;
      --blue: #60a5fa;
      --danger: #ef4444;
      --black: #0f172a;
      --sun-bg: #fff1f2;
      --sat-bg: #eff6ff;
      --sun-text: #dc2626;
      --sat-text: #2563eb;
    }

    body.dark {
      --bg: #020617;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --line: #1e293b;
      --card: #0f172a;
      --soft: #111827;
      --black: #e5e7eb;
      --sun-bg: #2a1017;
      --sat-bg: #0b1b33;
      --sun-text: #fca5a5;
      --sat-text: #93c5fd;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    button, input, select, textarea { font: inherit; }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 92px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      padding: 12px 12px 10px;
    }

    .top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .caption {
      display: flex;
      align-items: center;
      gap: 5px;
      margin: 0;
      color: var(--muted);
      font-size: 11px;
    }

    h1 {
      margin: 2px 0 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .login-email {
      max-width: 230px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 10.5px;
      margin-top: 3px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 999px;
      background: var(--soft);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .month-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .month-title-btn {
      flex: 1;
      border: 0;
      border-radius: 18px;
      background: transparent;
      color: var(--text);
      padding: 6px 8px;
      text-align: center;
    }

    .month-title {
      font-weight: 800;
      font-size: 17px;
    }

    .month-sub {
      color: var(--muted);
      font-size: 10.5px;
      margin-top: 1px;
    }

    .legend {
      display: flex;
      gap: 6px;
      margin-top: 9px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 9px;
      background: var(--soft);
      color: var(--text);
      font-size: 11px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    .main { padding: 10px; }

    .calendar-card {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
    }

    .dow-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid var(--line);
      background: var(--soft);
    }

    .dow-cell {
      padding: 7px 0;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .dow-cell.sun { color: var(--sun-text); }
    .dow-cell.sat { color: var(--sat-text); }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .day-cell {
      position: relative;
      min-height: 68px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--card);
      padding: 4px 3px;
      text-align: left;
      overflow: hidden;
    }

    .day-cell:nth-child(7n) { border-right: 0; }
    .day-cell.other-month { opacity: 0.55; }
    .day-cell.selected { outline: 2px solid #94a3b8; outline-offset: -2px; }

    .day-cell.sunday-cell { background: var(--sun-bg); }
    .day-cell.saturday-cell { background: var(--sat-bg); }

    .day-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2px;
      margin-bottom: 2px;
    }

    .day-number {
      width: 20px;
      height: 20px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--text);
      padding: 0;
    }

    .day-number.today {
      background: var(--black);
      color: var(--bg);
    }

    .day-number.holiday-text { color: var(--sun-text); }
    .day-number.saturday-text { color: var(--sat-text); }
    .day-number.today.holiday-text,
    .day-number.today.saturday-text { color: var(--bg); }

    .holiday-name {
      color: var(--sun-text);
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1.05;
      margin: -2px 0 2px 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-add {
      width: 18px;
      height: 18px;
      border: 0;
      border-radius: 999px;
      background: color-mix(in srgb, var(--soft) 75%, white);
      color: var(--muted);
      font-size: 13px;
      line-height: 1;
      padding: 0;
    }

    body.dark .mini-add { background: #1e293b; }

    .event-list {
      display: grid;
      gap: 2px;
    }

    .event-chip {
      width: 100%;
      border: 0;
      border-radius: 7px;
      color: white;
      padding: 2px 3px;
      text-align: left;
      font-size: 9.5px;
      line-height: 1.12;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .more-chip {
      color: var(--muted);
      font-size: 9px;
      padding: 0 3px;
    }

    .month-panel {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      padding: 12px;
    }

    .month-panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .month-list-date {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
    }

    .month-list-date:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    .list-event {
      width: 100%;
      border: 1px solid var(--line);
      border-left-width: 7px;
      border-radius: 16px;
      background: var(--soft);
      color: var(--text);
      padding: 9px 10px;
      text-align: left;
      margin-top: 7px;
    }

    .list-event-time {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .list-event-title {
      margin-top: 2px;
      font-size: 15px;
      font-weight: 800;
    }

    .list-event-note {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .empty {
      color: var(--muted);
      font-size: 13px;
      padding: 10px 2px 2px;
    }

    .fab {
      position: fixed;
      right: 20px;
      bottom: 22px;
      width: 64px;
      height: 64px;
      border: 0;
      border-radius: 999px;
      background: #0f172a;
      color: white;
      font-size: 34px;
      line-height: 1;
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.3);
      z-index: 25;
    }

    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: #f8fafc;
      color: #0f172a;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.06);
    }

    .lock-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: #0f172a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    .center { text-align: center; }

    .input, .select, .textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 18px;
      padding: 13px 14px;
      outline: none;
      min-height: 48px;
    }

    .textarea {
      min-height: 84px;
      resize: vertical;
      line-height: 1.5;
    }

    .login-card .input {
      background: white;
      color: #0f172a;
      border-color: #e5e7eb;
    }

    .form-stack { display: grid; gap: 10px; }

    .error {
      background: #fef2f2;
      color: #dc2626;
      border-radius: 16px;
      padding: 11px 13px;
      font-size: 13px;
    }

    .primary-btn {
      border: 0;
      border-radius: 18px;
      background: #0f172a;
      color: white;
      min-height: 50px;
      padding: 0 16px;
      font-weight: 700;
      width: 100%;
    }

    .danger-btn {
      border: 1px solid #fecaca;
      border-radius: 18px;
      background: #fff;
      color: #dc2626;
      min-height: 50px;
      padding: 0 16px;
      font-weight: 700;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.42);
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
    }

    .modal-bg.show { display: flex; }

    .modal {
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      overflow-y: auto;
      background: var(--card);
      color: var(--text);
      border-radius: 28px;
      padding: 16px;
      box-shadow: 0 18px 48px rgba(0,0,0,0.3);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .modal-title { font-size: 18px; font-weight: 800; }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .user-choice {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 18px;
      min-height: 58px;
      font-weight: 700;
    }

    .user-choice.active-me {
      background: #fdf2f8;
      color: #be185d;
      border-color: #fbcfe8;
    }

    .user-choice.active-partner {
      background: #eff6ff;
      color: #1d4ed8;
      border-color: #bfdbfe;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 13px 14px;
      font-size: 14px;
    }

    .bottom-actions { display: flex; gap: 8px; padding-top: 2px; }
    .bottom-actions .primary-btn { flex: 1; }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <div id="eventModal" class="modal-bg">
    <div class="modal">
      <div class="modal-head">
        <div id="modalTitle" class="modal-title">予定を追加</div>
        <button id="closeModalBtn" class="icon-btn" type="button">×</button>
      </div>

      <div class="form-stack">
        <select id="titleSelect" class="select">
          <option value="">内容を選択</option>
          <option value="歯医者">歯医者</option>
          <option value="美容院">美容院</option>
          <option value="野球甲子園">野球甲子園</option>
          <option value="野球ドーム">野球ドーム</option>
          <option value="飲み会">飲み会</option>
          <option value="自由入力">自由入力</option>
        </select>

        <input id="customTitleInput" class="input" placeholder="内容を入力" />
        <input id="dateInput" class="input" type="date" />

        <div class="two-col">
          <input id="startInput" class="input" type="time" />
          <input id="endInput" class="input" type="time" />
        </div>

        <textarea id="noteInput" class="textarea" placeholder="備考：誰との飲み会か、持ち物、場所の補足など"></textarea>

        <div class="two-col">
          <button id="meBtn" class="user-choice" type="button">わたし</button>
          <button id="partnerBtn" class="user-choice" type="button">彼</button>
        </div>

        <select id="repeatSelect" class="select">
          <option value="none">繰り返しなし</option>
          <option value="daily">毎日</option>
          <option value="weekly">毎週</option>
        </select>

        <label class="switch-row">
          <span>開始10分前に通知</span>
          <input id="notifyInput" type="checkbox" />
        </label>

        <div class="bottom-actions">
          <button id="deleteBtn" class="danger-btn" type="button">削除</button>
          <button id="saveBtn" class="primary-btn" type="button">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signOut,
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore,
      collection,
      query,
      where,
      onSnapshot,
      addDoc,
      updateDoc,
      deleteDoc,
      doc,
      serverTimestamp,
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDZtacCvuHNNmbkInDrQwSiA2J7g0F2tuI",
      authDomain: "eteshibayotei.firebaseapp.com",
      projectId: "eteshibayotei",
      storageBucket: "eteshibayotei.firebasestorage.app",
      messagingSenderId: "397435707548",
      appId: "1:397435707548:web:2475d8dc347bb355db0d59",
      measurementId: "G-1F0GKSWMTG"
    };

    const ALLOWED_EMAILS = ["nishida0510@gmail.com"];
    const SHARED_GROUP_ID = "couple-calendar-001";

    const USERS = {
      me: { label: "わたし", color: "#f472b6" },
      partner: { label: "彼", color: "#60a5fa" },
    };

    const PRESET_TITLES = ["歯医者", "美容院", "野球甲子園", "野球ドーム", "飲み会"];

    const HOLIDAYS = {
      "2026-01-01": "元日",
      "2026-01-12": "成人の日",
      "2026-02-11": "建国記念の日",
      "2026-02-23": "天皇誕生日",
      "2026-03-20": "春分の日",
      "2026-04-29": "昭和の日",
      "2026-05-03": "憲法記念日",
      "2026-05-04": "みどりの日",
      "2026-05-05": "こどもの日",
      "2026-05-06": "振替休日",
      "2026-07-20": "海の日",
      "2026-08-11": "山の日",
      "2026-09-21": "敬老の日",
      "2026-09-22": "休日",
      "2026-09-23": "秋分の日",
      "2026-10-12": "スポーツの日",
      "2026-11-03": "文化の日",
      "2026-11-23": "勤労感謝の日"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let authChecked = false;
    let currentDate = new Date();
    let selectedDate = new Date();
    let events = [];
    let online = false;
    let loading = true;
    let dark = localStorage.getItem("schedule-dark") === "true";
    let editingEvent = null;
    let selectedOwner = "me";
    let unsubscribeEvents = null;

    const root = document.getElementById("root");
    const modalEl = document.getElementById("eventModal");
    const modalTitle = document.getElementById("modalTitle");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const titleSelect = document.getElementById("titleSelect");
    const customTitleInput = document.getElementById("customTitleInput");
    const dateInput = document.getElementById("dateInput");
    const startInput = document.getElementById("startInput");
    const endInput = document.getElementById("endInput");
    const noteInput = document.getElementById("noteInput");
    const meBtn = document.getElementById("meBtn");
    const partnerBtn = document.getElementById("partnerBtn");
    const repeatSelect = document.getElementById("repeatSelect");
    const notifyInput = document.getElementById("notifyInput");
    const deleteBtn = document.getElementById("deleteBtn");
    const saveBtn = document.getElementById("saveBtn");

    function pad(n) { return String(n).padStart(2, "0"); }
    function toDateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
    function addDays(date, days) {
      const d = new Date(date);
      d.setDate(d.getDate() + days);
      return d;
    }
    function addMonths(date, months) {
      const d = new Date(date);
      d.setMonth(d.getMonth() + months);
      return d;
    }
    function timeToMinutes(time) {
      const [h, m] = time.split(":").map(Number);
      return h * 60 + m;
    }
    function minutesToTime(minutes) {
      return `${pad(Math.floor(minutes / 60))}:${pad(minutes % 60)}`;
    }
    function addHoursToTime(time, hours) {
      return minutesToTime(timeToMinutes(time) + hours * 60);
    }
    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
    function isHoliday(dateKey) { return Boolean(HOLIDAYS[dateKey]); }

    function getDefaultOwnerByEmail(email) {
      if (!email) return "me";
      return email === ALLOWED_EMAILS[1] ? "partner" : "me";
    }

    function getMonthCells(baseDate) {
      const first = new Date(baseDate.getFullYear(), baseDate.getMonth(), 1);
      const start = new Date(first);
      start.setDate(first.getDate() - first.getDay());
      return Array.from({ length: 42 }, (_, i) => addDays(start, i));
    }

    function eventOccursOn(event, dateKey) {
      if (event.date === dateKey) return true;
      if (!event.repeat || event.repeat === "none") return false;

      const base = new Date(event.date + "T00:00:00");
      const target = new Date(dateKey + "T00:00:00");
      const diffDays = Math.round((target - base) / 86400000);
      if (diffDays < 0) return false;
      if (event.repeat === "daily") return true;
      if (event.repeat === "weekly") return diffDays % 7 === 0;
      return false;
    }

    function getEventsForDate(dateKey) {
      return events
        .filter((event) => eventOccursOn(event, dateKey))
        .map((event) => ({ ...event, instanceDate: dateKey }))
        .sort((a, b) => {
          const t = (a.startTime || "00:00").localeCompare(b.startTime || "00:00");
          if (t !== 0) return t;
          return (a.title || "").localeCompare(b.title || "");
        });
    }

    function getEventsForCurrentMonth() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const result = [];

      for (let day = 1; day <= daysInMonth; day++) {
        const d = new Date(year, month, day);
        const key = toDateKey(d);
        const dayEvents = getEventsForDate(key);
        if (dayEvents.length > 0) {
          result.push({ date: d, dateKey: key, events: dayEvents });
        }
      }
      return result;
    }

    function render() {
      document.body.classList.toggle("dark", dark);

      if (!authChecked) {
        root.innerHTML = `
          <div class="login-wrap">
            <div class="center">
              <div class="lock-icon">🔒</div>
              <p>ログイン状態を確認中...</p>
            </div>
          </div>
        `;
        return;
      }

      if (!currentUser) {
        renderLogin();
        return;
      }

      renderApp();
    }

    function renderLogin() {
      root.innerHTML = `
        <div class="login-wrap">
          <div class="login-card">
            <div class="center">
              <div class="lock-icon">🔒</div>
              <p style="margin:0;color:#64748b;font-size:12px;">2人だけの共有カレンダー</p>
              <h1 style="margin:4px 0 6px;">ログイン</h1>
              <p style="margin:0 0 18px;color:#64748b;font-size:14px;">登録済みの人だけ利用できます。</p>
            </div>
            <div class="form-stack">
              <input id="loginEmail" class="input" type="email" placeholder="メールアドレス" autocomplete="email" />
              <input id="loginPassword" class="input" type="password" placeholder="パスワード" autocomplete="current-password" />
              <div id="loginError" class="error" style="display:none;"></div>
              <button id="loginBtn" class="primary-btn" type="button">ログイン</button>
            </div>
            <p class="hint">Firebase Authenticationに登録したメールアドレスとパスワードでログインしてください。</p>
          </div>
        </div>
      `;

      document.getElementById("loginBtn").addEventListener("click", login);
      document.getElementById("loginPassword").addEventListener("keydown", (e) => {
        if (e.key === "Enter") login();
      });
    }

    async function login() {
      const emailInput = document.getElementById("loginEmail");
      const passwordInput = document.getElementById("loginPassword");
      const errorEl = document.getElementById("loginError");
      const loginBtn = document.getElementById("loginBtn");
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      errorEl.style.display = "none";
      errorEl.textContent = "";

      if (!ALLOWED_EMAILS.includes(email)) {
        errorEl.textContent = "このメールアドレスは利用許可されていません。";
        errorEl.style.display = "block";
        return;
      }
      if (!password) {
        errorEl.textContent = "パスワードを入力してください。";
        errorEl.style.display = "block";
        return;
      }

      try {
        loginBtn.textContent = "ログイン中...";
        loginBtn.disabled = true;
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        console.error(error);
        errorEl.textContent = "ログインできませんでした。メールアドレスとパスワードを確認してください。";
        errorEl.style.display = "block";
      } finally {
        loginBtn.textContent = "ログイン";
        loginBtn.disabled = false;
      }
    }

    function renderApp() {
      const cells = getMonthCells(currentDate);
      const todayKey = toDateKey(new Date());
      const selectedKey = toDateKey(selectedDate);
      const currentMonth = currentDate.getMonth();
      const monthEvents = getEventsForCurrentMonth();

      root.innerHTML = `
        <div class="app">
          <header class="header">
            <div class="top-row">
              <div>
                <p class="caption">${online ? "🟢" : "🔴"} 2人用共有カレンダー ${loading ? "読み込み中" : online ? "同期中" : "未接続"}</p>
                <h1>スケジュール</h1>
                <div class="login-email">ログイン中：${escapeHtml(currentUser.email)}</div>
              </div>
              <div style="display:flex;gap:6px;">
                <button id="darkBtn" class="icon-btn" type="button">${dark ? "☀️" : "🌙"}</button>
                <button id="logoutBtn" class="icon-btn" type="button">↩</button>
              </div>
            </div>

            <div class="month-row">
              <button id="prevMonthBtn" class="icon-btn" type="button">‹</button>
              <button id="todayBtn" class="month-title-btn" type="button">
                <div class="month-title">${currentDate.getFullYear()}年 ${currentDate.getMonth() + 1}月</div>
                <div class="month-sub">タップで今月へ</div>
              </button>
              <button id="nextMonthBtn" class="icon-btn" type="button">›</button>
            </div>

            <div class="legend">
              <span class="pill"><span class="dot" style="background:${USERS.me.color}"></span>わたし</span>
              <span class="pill"><span class="dot" style="background:${USERS.partner.color}"></span>彼</span>
              <span class="pill"><span class="dot" style="background:var(--sun-text)"></span>日祝</span>
              <span class="pill"><span class="dot" style="background:var(--sat-text)"></span>土</span>
            </div>
          </header>

          <main class="main">
            <div class="calendar-card">
              <div class="dow-row">
                <div class="dow-cell sun">日</div>
                <div class="dow-cell">月</div>
                <div class="dow-cell">火</div>
                <div class="dow-cell">水</div>
                <div class="dow-cell">木</div>
                <div class="dow-cell">金</div>
                <div class="dow-cell sat">土</div>
              </div>
              <div class="month-grid">
                ${cells.map((d) => renderDayCell(d, currentMonth, todayKey, selectedKey)).join("")}
              </div>
            </div>

            <section class="month-panel">
              <div class="month-panel-title">
                <span>${currentDate.getMonth() + 1}月の予定一覧</span>
                <button id="addSelectedBtn" class="icon-btn" type="button">＋</button>
              </div>
              <div>
                ${monthEvents.length === 0 ? `<div class="empty">この月の予定はありません。</div>` : monthEvents.map((group) => `
                  <div class="month-list-date">${group.date.getMonth() + 1}/${group.date.getDate()}（${["日", "月", "火", "水", "木", "金", "土"][group.date.getDay()]}）</div>
                  ${group.events.map((ev) => `
                    <button class="list-event" data-event-id="${ev.id}" style="border-left-color:${ev.color || USERS[ev.user]?.color || USERS.me.color};" type="button">
                      <div class="list-event-time">${escapeHtml(ev.startTime)} - ${escapeHtml(ev.endTime)} ${ev.repeat && ev.repeat !== "none" ? `・${ev.repeat === "daily" ? "毎日" : "毎週"}` : ""}</div>
                      <div class="list-event-title">${escapeHtml(ev.title)}</div>
                      ${ev.note ? `<div class="list-event-note">${escapeHtml(ev.note)}</div>` : ""}
                    </button>
                  `).join("")}
                `).join("")}
              </div>
            </section>
          </main>

          <button id="fabBtn" class="fab" type="button">＋</button>
        </div>
      `;

      bindAppEvents();
    }

    function renderDayCell(date, currentMonth, todayKey, selectedKey) {
      const key = toDateKey(date);
      const dayEvents = getEventsForDate(key);
      const shown = dayEvents.slice(0, 2);
      const classes = ["day-cell"];
      const day = date.getDay();
      const holiday = isHoliday(key);

      if (date.getMonth() !== currentMonth) classes.push("other-month");
      if (key === selectedKey) classes.push("selected");
      if (day === 0 || holiday) classes.push("sunday-cell");
      if (day === 6) classes.push("saturday-cell");

      const holidayName = HOLIDAYS[key] || "";
      const dayNumberClass = ["day-number"];
      if (key === todayKey) dayNumberClass.push("today");
      if (day === 0 || holiday) dayNumberClass.push("holiday-text");
      if (day === 6) dayNumberClass.push("saturday-text");

      return `
        <div class="${classes.join(" ")}" data-date="${key}">
          <div class="day-head">
            <button class="${dayNumberClass.join(" ")}" data-date="${key}" type="button">${date.getDate()}</button>
            <button class="mini-add" data-add-date="${key}" type="button">＋</button>
          </div>
          ${holidayName ? `<div class="holiday-name">${escapeHtml(holidayName)}</div>` : ""}
          <div class="event-list">
            ${shown.map((ev) => `
              <button class="event-chip" data-event-id="${ev.id}" style="background:${ev.color || USERS[ev.user]?.color || USERS.me.color};" type="button">
                ${escapeHtml(ev.title)} ${escapeHtml(ev.startTime)}
              </button>
            `).join("")}
            ${dayEvents.length > 2 ? `<div class="more-chip">ほか ${dayEvents.length - 2}件</div>` : ""}
          </div>
        </div>
      `;
    }

    function bindAppEvents() {
      document.getElementById("darkBtn").addEventListener("click", () => {
        dark = !dark;
        localStorage.setItem("schedule-dark", String(dark));
        render();
      });
      document.getElementById("logoutBtn").addEventListener("click", async () => {
        await signOut(auth);
      });
      document.getElementById("prevMonthBtn").addEventListener("click", () => {
        currentDate = addMonths(currentDate, -1);
        selectedDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
        render();
      });
      document.getElementById("nextMonthBtn").addEventListener("click", () => {
        currentDate = addMonths(currentDate, 1);
        selectedDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
        render();
      });
      document.getElementById("todayBtn").addEventListener("click", () => {
        currentDate = new Date();
        selectedDate = new Date();
        render();
      });
      document.getElementById("fabBtn").addEventListener("click", () => openNew(toDateKey(selectedDate), "09:00"));
      document.getElementById("addSelectedBtn").addEventListener("click", () => openNew(toDateKey(selectedDate), "09:00"));

      document.querySelectorAll(".day-cell, .day-number").forEach((el) => {
        el.addEventListener("click", (e) => {
          if (e.target.closest(".mini-add") || e.target.closest(".event-chip")) return;
          const dateKey = el.dataset.date;
          if (!dateKey) return;
          selectedDate = new Date(dateKey + "T00:00:00");
          if (selectedDate.getMonth() !== currentDate.getMonth()) currentDate = new Date(selectedDate);
          render();
        });
      });

      document.querySelectorAll(".mini-add").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          selectedDate = new Date(btn.dataset.addDate + "T00:00:00");
          if (selectedDate.getMonth() !== currentDate.getMonth()) currentDate = new Date(selectedDate);
          openNew(btn.dataset.addDate, "09:00");
        });
      });

      document.querySelectorAll(".event-chip, .list-event").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const ev = events.find((item) => item.id === btn.dataset.eventId);
          if (ev) openEdit(ev);
        });
      });
    }

    function updateOwnerButtons() {
      meBtn.className = selectedOwner === "me" ? "user-choice active-me" : "user-choice";
      partnerBtn.className = selectedOwner === "partner" ? "user-choice active-partner" : "user-choice";
    }

    function openNew(dateKey, time) {
      editingEvent = null;
      selectedOwner = getDefaultOwnerByEmail(currentUser?.email);
      modalTitle.textContent = "予定を追加";
      deleteBtn.style.display = "none";
      titleSelect.value = "";
      customTitleInput.value = "";
      customTitleInput.style.display = "block";
      dateInput.value = dateKey;
      startInput.value = time;
      endInput.value = addHoursToTime(time, 2);
      noteInput.value = "";
      repeatSelect.value = "none";
      notifyInput.checked = true;
      updateOwnerButtons();
      modalEl.classList.add("show");
    }

    function openEdit(original) {
      editingEvent = original;
      selectedOwner = original.user || "me";
      modalTitle.textContent = "予定を編集";
      deleteBtn.style.display = "inline-block";

      if (PRESET_TITLES.includes(original.title)) {
        titleSelect.value = original.title;
        customTitleInput.value = "";
        customTitleInput.style.display = "none";
      } else {
        titleSelect.value = "自由入力";
        customTitleInput.value = original.title || "";
        customTitleInput.style.display = "block";
      }

      dateInput.value = original.date;
      startInput.value = original.startTime;
      endInput.value = original.endTime;
      noteInput.value = original.note || "";
      repeatSelect.value = original.repeat || "none";
      notifyInput.checked = !!original.notify;
      updateOwnerButtons();
      modalEl.classList.add("show");
    }

    function closeModal() {
      modalEl.classList.remove("show");
      editingEvent = null;
    }

    function getFinalTitle() {
      if (titleSelect.value === "自由入力" || !PRESET_TITLES.includes(titleSelect.value)) {
        return customTitleInput.value.trim();
      }
      return titleSelect.value.trim();
    }

    async function saveEvent() {
      if (!currentUser) return;
      const finalTitle = getFinalTitle();
      if (!finalTitle) {
        alert("内容を入力してください。");
        return;
      }

      let startTime = startInput.value;
      let endTime = endInput.value;
      if (timeToMinutes(endTime) <= timeToMinutes(startTime)) {
        endTime = addHoursToTime(startTime, 2);
      }

      const savedDate = dateInput.value;
      const data = {
        groupId: SHARED_GROUP_ID,
        date: savedDate,
        startTime,
        endTime,
        title: finalTitle,
        note: noteInput.value.trim(),
        user: selectedOwner,
        color: USERS[selectedOwner].color,
        repeat: repeatSelect.value || "none",
        notify: !!notifyInput.checked,
        updatedAt: serverTimestamp(),
        updatedByUid: currentUser.uid,
        updatedByEmail: currentUser.email,
      };

      try {
        saveBtn.disabled = true;
        saveBtn.textContent = "保存中...";
        if (editingEvent) {
          await updateDoc(doc(db, "events", editingEvent.id), data);
        } else {
          await addDoc(collection(db, "events"), {
            ...data,
            createdAt: serverTimestamp(),
            createdByUid: currentUser.uid,
            createdByEmail: currentUser.email,
          });
        }
        selectedDate = new Date(savedDate + "T00:00:00");
        currentDate = new Date(selectedDate);
        closeModal();
        render();
      } catch (error) {
        console.error(error);
        alert("保存できませんでした。Firestoreルールや通信状態を確認してください。");
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "保存";
      }
    }

    async function deleteEvent() {
      if (!editingEvent || !currentUser) return;
      if (!confirm("この予定を削除しますか？")) return;
      try {
        await deleteDoc(doc(db, "events", editingEvent.id));
        closeModal();
      } catch (error) {
        console.error(error);
        alert("削除できませんでした。Firestoreルールや通信状態を確認してください。こう");
      }
    }

    titleSelect.addEventListener("change", () => {
      customTitleInput.style.display = titleSelect.value === "自由入力" || !PRESET_TITLES.includes(titleSelect.value) ? "block" : "none";
    });
    startInput.addEventListener("change", () => {
      if (!editingEvent && startInput.value) {
        endInput.value = addHoursToTime(startInput.value, 2);
      }
    });
    meBtn.addEventListener("click", () => {
      selectedOwner = "me";
      updateOwnerButtons();
    });
    partnerBtn.addEventListener("click", () => {
      selectedOwner = "partner";
      updateOwnerButtons();
    });
    closeModalBtn.addEventListener("click", closeModal);
    modalEl.addEventListener("click", (e) => {
      if (e.target === modalEl) closeModal();
    });
    saveBtn.addEventListener("click", saveEvent);
    deleteBtn.addEventListener("click", deleteEvent);

    onAuthStateChanged(auth, async (user) => {
      if (user && !ALLOWED_EMAILS.includes(user.email)) {
        await signOut(auth);
        currentUser = null;
      } else {
        currentUser = user || null;
      }
      authChecked = true;

      if (unsubscribeEvents) {
        unsubscribeEvents();
        unsubscribeEvents = null;
      }

      if (currentUser) {
        listenEvents();
      } else {
        events = [];
        online = false;
        loading = false;
        render();
      }
    });

    function listenEvents() {
      loading = true;
      render();

      const eventsRef = collection(db, "events");
      const q = query(
        eventsRef,
        where("groupId", "==", SHARED_GROUP_ID)
      );

      unsubscribeEvents = onSnapshot(
        q,
        (snapshot) => {
          events = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
          loading = false;
          online = true;
          render();
        },
        (error) => {
          console.error(error);
          loading = false;
          online = false;
          render();
          alert("Firestoreの読み込みに失敗しました。ルールを確認してください。");
        }
      );
    }

    render();
  </script>
</body>
</html>
